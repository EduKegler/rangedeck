<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="50%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  
  <!-- Grid representation (3x3 simplified) -->
  <g transform="translate(15, 15)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="20" height="20" rx="3" fill="#ef4444" opacity="0.9"/>
    <rect x="25" y="0" width="20" height="20" rx="3" fill="#ef4444" opacity="0.7"/>
    <rect x="50" y="0" width="20" height="20" rx="3" fill="#22c55e" opacity="0.6"/>
    
    <!-- Row 2 -->
    <rect x="0" y="25" width="20" height="20" rx="3" fill="#ef4444" opacity="0.7"/>
    <rect x="25" y="25" width="20" height="20" rx="3" fill="#3b82f6" opacity="0.9"/>
    <rect x="50" y="25" width="20" height="20" rx="3" fill="#22c55e" opacity="0.5"/>
    
    <!-- Row 3 -->
    <rect x="0" y="50" width="20" height="20" rx="3" fill="#22c55e" opacity="0.6"/>
    <rect x="25" y="50" width="20" height="20" rx="3" fill="#22c55e" opacity="0.5"/>
    <rect x="50" y="50" width="20" height="20" rx="3" fill="#475569" opacity="0.4"/>
  </g>
  
  <!-- Accent bar -->
  <rect x="10" y="88" width="80" height="4" rx="2" fill="url(#accent)"/>
</svg>
